<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Timer/stopwatch: circle with hand -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Timer hand (pointing up-right for "running") -->
  <path d="M16 12 L16 16 L19 19" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top knob -->
  <circle cx="16" cy="8" r="1.5" fill="white"/>
</svg>
